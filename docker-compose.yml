services:
  nuage-db:
    container_name: nuage-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nuage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nuage-internal-db}
      POSTGRES_DB: ${POSTGRES_DB:-nuage}
    volumes:
    - db_data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5432'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  nuage-minio:
    container_name: nuage-minio
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nuage-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nuage-internal-storage}
    volumes:
    - storage_data:/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '9000'
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
    - '9000'
    - '9001'
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  nuage-api:
    container_name: nuage-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
    - '4000'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.nuage-web.rule: Host(`nuage.facile.studio`)
      traefik.http.routers.nuage-web.entrypoints: web
      traefik.http.routers.nuage-web.middlewares: redirect-to-https@file
      traefik.http.routers.nuage-web.service: nuage-svc
      traefik.http.routers.nuage-secure.rule: Host(`nuage.facile.studio`)
      traefik.http.routers.nuage-secure.entrypoints: websecure
      traefik.http.routers.nuage-secure.tls.certresolver: letsencrypt
      traefik.http.routers.nuage-secure.service: nuage-svc
      traefik.http.routers.nuage-webdav-web.rule: Host(`nuage.facile.studio`) && PathPrefix(`/webdav`)
      traefik.http.routers.nuage-webdav-web.entrypoints: web
      traefik.http.routers.nuage-webdav-web.middlewares: redirect-to-https@file
      traefik.http.routers.nuage-webdav-web.service: nuage-svc
      traefik.http.routers.nuage-webdav-secure.rule: Host(`nuage.facile.studio`) &&
        PathPrefix(`/webdav`)
      traefik.http.routers.nuage-webdav-secure.entrypoints: websecure
      traefik.http.routers.nuage-webdav-secure.tls.certresolver: letsencrypt
      traefik.http.routers.nuage-webdav-secure.service: nuage-svc
      traefik.http.services.nuage-svc.loadbalancer.server.port: '4000'
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-nuage}:${POSTGRES_PASSWORD:-nuage-internal-db}@nuage-db:5432/${POSTGRES_DB:-nuage}?sslmode=disable
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_DIR: /app/data
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MINIO_ENDPOINT: nuage-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-nuage-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-nuage-internal-storage}
      MINIO_BUCKET: nuage
      MINIO_USE_SSL: 'false'
      PRESIGN_SECRET: ${PRESIGN_SECRET:-}
      JOURNAL_URL: ${JOURNAL_URL:-}
      JOURNAL_TOKEN: ${JOURNAL_TOKEN:-}
    volumes:
    - api_data:/app/data
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4000'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      nuage-db:
        condition: service_healthy
      nuage-minio:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
networks:
  dokploy-network:
    external: true
volumes:
  db_data:
    name: nuage_db_data
  storage_data:
    name: nuage_storage_data
  api_data:
    name: nuage_api_data
