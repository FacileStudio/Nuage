<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<title>Nuage · File storage for the studio</title>
		<meta name="description" content="The studio drive, connected to every tool through an S3-compatible API. Share files with no middleman." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://nuage.facile.studio/" />
		<meta property="og:title" content="Nuage · File storage for the studio" />
		<meta property="og:description" content="The studio drive, connected to every tool through an S3-compatible API. Share files with no middleman." />
		<meta property="og:image" content="https://nuage.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Nuage: File storage for the studio" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Nuage · File storage for the studio" />
		<meta name="twitter:description" content="The studio drive, connected to every tool through an S3-compatible API. Share files with no middleman." />
		<meta name="twitter:image" content="https://nuage.facile.studio/og-image.png" />

		<meta name="color-scheme" content="light dark" />

		<script>
			// Resolve the theme before first paint so the app never flashes light-on-dark.
			// Both classes are set: muse paints dark from a media query scoped to
			// `:root:not(.light)`, so only an explicit `light` forces light on a dark OS.
			(function () {
				try {
					var stored = localStorage.getItem('nuage.theme');
					var dark =
						stored === 'dark' ||
						((!stored || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%

	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
