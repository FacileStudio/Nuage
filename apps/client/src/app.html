<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Nuage" />
		<meta property="og:url" content="https://nuage.facile.studio/" />
		<meta property="og:title" content="Nuage — Self-hosted file storage" />
		<meta
			property="og:description"
			content="Self-hosted cloud file storage. Files live in spaces, are versioned on every reupload, survive deletion in a trash, and speak WebDAV."
		/>
		<meta property="og:image" content="https://nuage.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Nuage — Self-hosted file storage" />
		<meta
			name="twitter:description"
			content="Self-hosted cloud file storage. Files live in spaces, are versioned on every reupload, survive deletion in a trash, and speak WebDAV."
		/>
		<meta name="twitter:image" content="https://nuage.facile.studio/og-image.png" />

		<script>
			// Resolve the theme before first paint so the app never flashes light-on-dark.
			// Both classes are set: muse paints dark from a media query scoped to
			// `:root:not(.light)`, so only an explicit `light` forces light on a dark OS.
			(function () {
				try {
					var stored = localStorage.getItem('nuage.theme');
					var dark =
						stored === 'dark' ||
						((!stored || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%

		<title>Nuage — Self-hosted file storage</title>
		<meta
			name="description"
			content="Self-hosted cloud file storage. Files live in spaces, are versioned on every reupload, survive deletion in a trash, and speak WebDAV."
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
