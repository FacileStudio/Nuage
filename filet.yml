# The Facile suite standard, enforced by filet: https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      the pre-push gate: the rules, douane and the test runner
#
# Lists in a preset are replaced, not merged, so requiredFiles is restated with
# the two modules that are mounted from main.go rather than through a router.

preset: facile
kind: app

architecture:
  requiredDirs: [apps/api, apps/client]
  requiredFiles:
    "apps/api/modules/*": [router.go]
    "apps/api/modules/docs": []
    "apps/api/modules/webdav": []
