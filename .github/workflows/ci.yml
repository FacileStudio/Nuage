name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: apps/api

    # The integration tests run against a real Postgres and a real MinIO, and CI=1 turns a
    # missing service into a failure instead of a skip. The credentials are the defaults the
    # tests read (tests/helpers_test.go), so no TEST_MINIO_* variable is needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuage
          POSTGRES_PASSWORD: nuage-internal-db
          POSTGRES_DB: nuage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      CI: '1'
      TEST_DATABASE_URL: postgres://nuage:nuage-internal-db@127.0.0.1:5432/nuage_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=nuage-minio -e MINIO_ROOT_PASSWORD=nuage-internal-storage \
            pgsty/minio:RELEASE.2026-06-18T00-00-00Z server /data
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build -o /dev/null .

      - name: unit tests
        if: matrix.shard == 0
        run: go test -p 1 -count=1 -timeout 10m $(go list ./... | grep -v '/tests$')

      - name: integration tests (shard ${{ matrix.shard }} of 3)
        run: |
          names=$(go test -list '^Test' ./tests | grep '^Test' | awk -v shard=${{ matrix.shard }} 'NR % 3 == shard' | paste -sd'|')
          go test -p 1 -count=1 -timeout 25m -run "^(${names})\$" ./tests

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: svelte-check
        run: bun run check

      - name: tests
        run: bun run test

      - name: build
        run: bun run build

  filet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: FacileStudio/filet@v0.3.0
        with:
          version: v0.3.0
          fail-on: error
          antenne-url: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          antenne-secret: ${{ secrets.ANTENNE_FILET_SECRET }}
